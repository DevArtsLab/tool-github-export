name = "data-devartslab"
main = "src/index.ts"
compatibility_date = "2026-10-04"
minify = true
workers_dev = false

# Custom domain: DNS record is created automatically (zone is on this account).
routes = [
  { pattern = "data.devartslab.com", custom_domain = true },
]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "github-export"

[triggers]
# Daily at 07:00 UTC, after the export workflow commits (~06:15 UTC).
# HTTP-triggered resync is not possible: Bot Fight Mode challenges CI curl clients.
crons = ["0 7 * * *"]

[observability]
enabled = true
